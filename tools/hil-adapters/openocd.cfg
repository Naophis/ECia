# OpenOCD configuration for the ECia board (STM32G431KBU6 + MP6540HA).
#
# Only the hilctl adapter scripts in this directory load this file. Nothing
# here runs `init` or touches the target, so each adapter decides for itself
# whether the target ends up halted, reset, or left running -- in particular
# `verify_halted` must observe the state, never create it.
#
# STM32G431 is supported by OpenOCD's own target script, so the only board
# specific choices are the adapter and the transport. The probe is an
# ST-LINK/V2 (USB 0483:3748); the adapters refuse to run unless exactly one
# ST-LINK with the expected serial is attached, so no serial filter is set
# here.

source [find interface/stlink.cfg]
transport select swd

source [find target/stm32g4x.cfg]
